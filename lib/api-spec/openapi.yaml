openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: businesses
    description: Synthetic business seed data
  - name: forecast
    description: Weather signal forecasts
paths:
  /brand/analyze-poster:
    post:
      operationId: analyzePoster
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PosterAnalysisInput" }
      responses:
        "200":
          description: Text-only poster analysis, or deterministic fallback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosterAnalysis" }
  /brand/analyze-website:
    post:
      operationId: analyzeWebsite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebsiteAnalysisInput" }
      responses:
        "200":
          description: Website voice analysis or fallback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebsiteAnalysis" }
  /businesses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getBusiness
      responses:
        "200":
          description: Business
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Business" }
    patch:
      operationId: updateBusiness
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessInput" }
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Business" }
  /ai/status:
    get:
      operationId: getAIStatus
      responses:
        "200":
          description: Server AI configuration (no credentials)
          content:
            application/json:
              schema:
                type: object
                required: [configured]
                properties:
                  configured: { type: boolean }
                  model: { type: string }
  /drafts/regenerate:
    post:
      operationId: regenerateDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegenerationInput" }
      responses:
        "200":
          description: Draft with replacement copy only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignDraft" }
  /generate:
    post:
      operationId: generateDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerationInput" }
      responses:
        "200":
          description: Template draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignDraft" }
  /drafts:
    get:
      operationId: listDrafts
      parameters:
        - { name: businessId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Stored drafts for this business
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CampaignDraft" }
    patch:
      operationId: updateDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftUpdate" }
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignDraft" }
  /approve:
    post:
      operationId: decideDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalInput" }
      responses:
        "200":
          description: Published or rejected draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignDraft" }
  /log:
    get:
      operationId: listActivityLog
      parameters:
        - { name: businessId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Append-only activity, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LogEntry" }
  /trigger:
    post:
      operationId: triggerSignal
      summary: Evaluate a live or simulated forecast and return campaign options
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerInput"
      responses:
        "200":
          description: Evaluated forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerResult"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /businesses:
    post:
      operationId: createBusiness
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessInput" }
      responses:
        "200":
          description: Created business
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Business" }
    get:
      operationId: listBusinesses
      tags: [businesses]
      summary: List demo businesses
      responses:
        "200":
          description: Businesses available in the demo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"
  /forecast:
    get:
      operationId: getForecast
      tags: [forecast]
      summary: Get a five-day haze forecast for a business
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
        - name: signalId
          in: query
          required: true
          schema:
            type: string
            enum: [haze]
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [live, simulated]
      responses:
        "200":
          description: Five-day haze forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalForecast"
        "404":
          description: Business or signal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    BusinessInput:
      type: object
      required: [name, type, city, lat, lon, brandKit]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        type: { type: string, enum: [cafe, laundromat, retail, other] }
        city: { type: string, minLength: 1, maxLength: 150 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        brandKit: { $ref: "#/components/schemas/BrandKit" }
    PosterAnalysisInput:
      type: object
      required: [colours, description, toneChips]
      properties:
        businessId: { type: string }
        colours:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        description: { type: string, minLength: 1, maxLength: 2000 }
        toneChips:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 80 }
    PosterAnalysis:
      type: object
      required: [fallback, summary]
      properties:
        fallback: { type: boolean }
        summary: { type: string }
        layout: { type: string }
        typographyStyle: { type: string }
        tone: { type: string }
        model: { type: string }
    WebsiteAnalysisInput:
      type: object
      required: [url]
      properties:
        url: { type: string, minLength: 1, maxLength: 2000 }
        businessId: { type: string }
    WebsiteAnalysis:
      type: object
      required: [fallback]
      properties:
        fallback: { type: boolean }
        voiceSummary: { type: string }
        keyThemes:
          type: array
          items: { type: string }
        suggestedTone:
          type: array
          items: { type: string }
        model: { type: string }
    RegenerationInput:
      type: object
      required: [draftId]
      properties:
        draftId: { type: string, minLength: 1 }
    GenerationInput:
      type: object
      required: [businessId, alertId, optionId]
      properties:
        businessId: { type: string, minLength: 1 }
        alertId: { type: string, minLength: 1 }
        optionId: { type: string, minLength: 1 }
        useAI: { type: boolean }
    CampaignCopy:
      type: object
      required: [headline, caption_bm, caption_en, hashtags, cta, rationale, source]
      properties:
        headline: { type: string, maxLength: 300 }
        caption_bm: { type: string, maxLength: 5000 }
        caption_en: { type: string, maxLength: 5000 }
        hashtags:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 100 }
        cta: { type: string, maxLength: 500 }
        rationale: { type: string, maxLength: 5000 }
        source: { type: string, enum: [ai, template] }
        model: { type: string }
        fallbackReason: { type: string }
    DraftUpdate:
      type: object
      required: [draftId]
      properties:
        draftId: { type: string, minLength: 1 }
        copy: { $ref: "#/components/schemas/CampaignCopy" }
        offer: { type: string, maxLength: 2000 }
        budgetRM: { type: number }
        channels:
          type: array
          items: { type: string, enum: [facebook, instagram, whatsapp, tiktok] }
        action: { type: string, enum: [submit] }
    ApprovalInput:
      type: object
      required: [draftId, decision]
      properties:
        draftId: { type: string, minLength: 1 }
        decision: { type: string, enum: [approve, reject] }
        budgetRM: { type: number }
        reason: { type: string, maxLength: 2000 }
    DraftHistory:
      type: object
      required: [at, by, action]
      properties:
        at: { type: string }
        by: { type: string }
        action: { type: string }
    PublishResult:
      type: object
      required: [platforms, postIds, status, publishedAt]
      properties:
        platforms:
          type: array
          items: { type: string }
        postIds:
          type: object
          additionalProperties: { type: string }
        adId: { type: string }
        status: { type: string, enum: ["published (simulated)"] }
        publishedAt: { type: string }
    CampaignDraft:
      type: object
      required: [id, businessId, alertId, option, copy, budgetRM, channels, status, createdBy, history]
      properties:
        id: { type: string }
        businessId: { type: string }
        alertId: { type: string }
        option: { $ref: "#/components/schemas/CampaignOption" }
        copy: { $ref: "#/components/schemas/CampaignCopy" }
        budgetRM: { type: number }
        channels:
          type: array
          items: { type: string, enum: [facebook, instagram, whatsapp, tiktok] }
        status: { type: string, enum: [draft, pending_approval, published, rejected] }
        createdBy: { type: string }
        approvedBy: { type: string }
        rejectReason: { type: string }
        publishResult: { $ref: "#/components/schemas/PublishResult" }
        history:
          type: array
          items: { $ref: "#/components/schemas/DraftHistory" }
    LogEntry:
      type: object
      required: [id, timestamp, actor, role, businessId, action, details]
      properties:
        id: { type: string }
        timestamp: { type: string }
        actor: { type: string }
        role: { type: string, enum: [staff, owner] }
        businessId: { type: string }
        action: { type: string }
        details:
          type: object
          additionalProperties: {}
    TriggerInput:
      type: object
      required: [businessId, signalId]
      properties:
        businessId: { type: string, minLength: 1 }
        signalId: { type: string, enum: [haze] }
        simulate: { type: boolean }
    TriggerResult:
      type: object
      required: [forecast, alert, options]
      properties:
        forecast:
          $ref: "#/components/schemas/SignalForecast"
        alert:
          anyOf:
            - $ref: "#/components/schemas/WeatherAlert"
            - type: "null"
        options:
          type: array
          items:
            $ref: "#/components/schemas/CampaignOption"
    WeatherAlert:
      type: object
      required: [id, businessId, signalId, affectedDates, peakDate, peakLevelLabel, daysAhead, createdAt, open]
      properties:
        id: { type: string }
        businessId: { type: string }
        signalId: { type: string, enum: [haze] }
        affectedDates:
          type: array
          items: { type: string }
        peakDate: { type: string }
        peakLevelLabel: { type: string }
        daysAhead: { type: integer }
        createdAt: { type: string }
        open: { type: boolean }
    CampaignOption:
      type: object
      required: [id, signalId, kind, title, description, reason, offer, suggestedBudgetRM]
      properties:
        id: { type: string }
        signalId: { type: string, enum: [haze] }
        kind: { type: string }
        title: { type: string }
        description: { type: string }
        reason: { type: string }
        offer: { type: string }
        suggestedBudgetRM: { type: number }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Business:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [cafe, laundromat, retail, other]
        city:
          type: string
        lat:
          type: number
        lon:
          type: number
        socialPages:
          $ref: "#/components/schemas/SocialPages"
        brandKit:
          $ref: "#/components/schemas/BrandKit"
      required: [id, name, type, city, lat, lon, socialPages, brandKit]
    SocialPages:
      type: object
      properties:
        facebookPageId:
          type: string
        instagramHandle:
          type: string
      required: [facebookPageId, instagramHandle]
    BrandKit:
      type: object
      properties:
        logoPath:
          type: string
        logoDataUrl:
          type: string
          maxLength: 2796250
        pastPosterDataUrl:
          type: string
          maxLength: 2796250
        pastPosterPath:
          type: string
        brandColours:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            pattern: "^#[0-9A-Fa-f]{6}$"
        posterPath:
          type: string
        posterColours:
          type: array
          maxItems: 5
          items:
            type: string
            pattern: "^#[0-9A-Fa-f]{6}$"
        posterDescription:
          type: string
          maxLength: 2000
        posterStyleSummary:
          type: string
          maxLength: 3000
        websiteUrl:
          type: string
          maxLength: 2000
        websiteVoiceSummary:
          type: string
          maxLength: 3000
        ethos:
          type: string
          minLength: 1
          maxLength: 2000
        toneChips:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 80
        products:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/Product"
        targetCustomers:
          type: string
          minLength: 1
          maxLength: 2000
        delivery:
          type: boolean
        channels:
          type: array
          items:
            type: string
            enum: [facebook, instagram, whatsapp, tiktok]
        language:
          type: string
          enum: [bm, en, both]
        neverSay:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 100
        monthlyAdBudgetCapRM:
          type: number
          minimum: 0
          maximum: 1000000
        approverUserId:
          type: string
          enum: [u2]
        baselineWeeklySalesRM:
          type: number
          minimum: 0
        lastBadWeatherDipPct:
          type: number
          minimum: 0
          maximum: 100
      required:
        - brandColours
        - ethos
        - toneChips
        - products
        - targetCustomers
        - delivery
        - channels
        - language
        - neverSay
        - monthlyAdBudgetCapRM
        - approverUserId
        - baselineWeeklySalesRM
        - lastBadWeatherDipPct
    Product:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        priceRM:
          type: number
          minimum: 0
      required: [name, priceRM]
    SignalForecast:
      type: object
      properties:
        signalId:
          type: string
          enum: [haze]
        businessId:
          type: string
        days:
          type: array
          items:
            $ref: "#/components/schemas/SignalDay"
        source:
          type: string
          enum: [open-meteo, simulated, offline]
        fetchedAt:
          type: string
          format: date-time
      required: [signalId, businessId, days, source, fetchedAt]
    SignalDay:
      type: object
      properties:
        date:
          type: string
          format: date
        value:
          type: number
        unit:
          type: string
        level:
          type: integer
          minimum: 0
          maximum: 3
        levelLabel:
          type: string
        detail:
          type: string
      required: [date, value, unit, level, levelLabel]

